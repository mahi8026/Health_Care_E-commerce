<!DOCTYPE html>
<html>
<head>
  <title>Test Product API</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .product { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
    .image { max-width: 200px; margin: 10px 0; }
    pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Product API Test</h1>
  <button onclick="testAPI()">Test API</button>
  <div id="results"></div>

  <script>
    async function testAPI() {
      const results = document.getElementById('results');
      results.innerHTML = '<p>Loading...</p>';
      
      try {
        // Test production API
        const response = await fetch('https://health-care-e-commerce.onrender.com/api/products?limit=5');
        const data = await response.json();
        
        if (data.success && data.products) {
          let html = `<h2>Found ${data.products.length} products</h2>`;
          
          data.products.forEach((product, idx) => {
            html += `
              <div class="product">
                <h3>${idx + 1}. ${product.name}</h3>
                <p><strong>SKU:</strong> ${product.sku}</p>
                <p><strong>Images:</strong> ${product.images ? product.images.length : 0}</p>
                
                ${product.images && product.images.length > 0 ? `
                  <div>
                    <p><strong>First Image URL:</strong></p>
                    <pre>${product.images[0].url || 'NO URL'}</pre>
                    <img src="${product.images[0].url}" class="image" onerror="this.style.border='2px solid red'" />
                  </div>
                ` : '<p style="color: red;">NO IMAGES</p>'}
                
                <details>
                  <summary>Full Product Data</summary>
                  <pre>${JSON.stringify(product, null, 2)}</pre>
                </details>
              </div>
            `;
          });
          
          results.innerHTML = html;
        } else {
          results.innerHTML = `<p style="color: red;">API Error: ${data.message || 'Unknown error'}</p>`;
        }
      } catch (error) {
        results.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
      }
    }
  </script>
</body>
</html>
