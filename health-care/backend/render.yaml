services:
  - type: web
    name: mediportbd-api
    runtime: node
    region: singapore
    plan: free
    rootDir: .
    buildCommand: npm install --production
    startCommand: npm start
    healthCheckPath: /api/health
    # Manual-release policy: auto-deploy is intentionally OFF, so merging to
    # main never reaches production without an explicit Render deploy. This
    # must stay in sync with the Render dashboard setting for this service -
    # a Blueprint sync would otherwise silently re-enable auto-deploy.
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: info
    # Note: Add all other environment variables in Render Dashboard UI
    # (MongoDB URI, JWT secrets, API keys, etc.)
