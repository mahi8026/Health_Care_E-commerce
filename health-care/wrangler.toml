# Cloudflare Pages + OpenNext configuration
# Docs: https://opennext.js.org/cloudflare

name = "medcorebd"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Point to .open-next/ root which contains BOTH _worker.js AND static assets
# Structure after build-cf-fix.js runs:
#   .open-next/_worker.js          ← Worker entry
#   .open-next/cloudflare/         ← Worker deps (sibling to _worker.js)
#   .open-next/middleware/
#   .open-next/server-functions/
#   .open-next/.build/
#   .open-next/_next/              ← static JS/CSS (copied from assets/)
#   .open-next/images/             ← public images
pages_build_output_dir = ".open-next"

[vars]
CF_PAGES = "1"
