<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Top accent bar -->
  <rect width="1200" height="8" fill="#0E8A6E"/>

  <!-- Bottom accent bar -->
  <rect y="622" width="1200" height="8" fill="#0B2545"/>

  <!-- Left decorative panel -->
  <rect width="420" height="630" fill="#0B2545"/>

  <!-- Medical cross icon (centered in left panel) -->
  <!-- Horizontal bar -->
  <rect x="155" y="255" width="110" height="40" rx="6" fill="#0E8A6E"/>
  <!-- Vertical bar -->
  <rect x="185" y="225" width="40" height="110" rx="6" fill="#0E8A6E"/>

  <!-- Circle around cross -->
  <circle cx="210" cy="310" r="90" fill="none" stroke="#0E8A6E" stroke-width="4" opacity="0.4"/>
  <circle cx="210" cy="310" r="110" fill="none" stroke="#0E8A6E" stroke-width="2" opacity="0.2"/>

  <!-- Brand name on left panel -->
  <text x="210" y="450" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">MedCore BD</text>

  <!-- Divider line -->
  <rect x="420" y="0" width="4" height="630" fill="#0E8A6E"/>

  <!-- Right content area -->
  <!-- Main headline -->
  <text x="780" y="220" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#0B2545" text-anchor="middle">Medical Excellence</text>
  <text x="780" y="285" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#0B2545" text-anchor="middle">at Your Fingertips</text>

  <!-- Tagline -->
  <text x="780" y="355" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#555555" text-anchor="middle">Your complete source for medical excellence</text>

  <!-- Divider -->
  <rect x="640" y="385" width="280" height="3" rx="2" fill="#0E8A6E"/>

  <!-- Feature bullets -->
  <circle cx="620" cy="430" r="6" fill="#0E8A6E"/>
  <text x="638" y="436" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#333333">Surgical Instruments</text>

  <circle cx="620" cy="475" r="6" fill="#0E8A6E"/>
  <text x="638" y="481" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#333333">Diagnostic Machines</text>

  <circle cx="870" cy="430" r="6" fill="#0E8A6E"/>
  <text x="888" y="436" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#333333">Reagents &amp; Chemicals</text>

  <circle cx="870" cy="475" r="6" fill="#0E8A6E"/>
  <text x="888" y="481" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#333333">Lab Equipment</text>

  <!-- URL -->
  <text x="780" y="560" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#0E8A6E" text-anchor="middle" font-weight="600">medcorebd.com</text>
</svg>
