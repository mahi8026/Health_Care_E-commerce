<!DOCTYPE html>
<html>
<head>
    <title>Push Notification Debug</title>
</head>
<body>
    <h1>Push Notification Environment Check</h1>
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        // Check if service worker and push are supported
        results.innerHTML += '<h2>Browser Support:</h2>';
        results.innerHTML += `<p>Service Worker: ${'serviceWorker' in navigator ? '✅' : '❌'}</p>`;
        results.innerHTML += `<p>Push Manager: ${'PushManager' in window ? '✅' : '❌'}</p>`;
        results.innerHTML += `<p>Notifications: ${'Notification' in window ? '✅' : '❌'}</p>`;
        
        // Log environment variable (will be undefined in production, that's expected)
        results.innerHTML += '<h2>VAPID Key Check:</h2>';
        results.innerHTML += `<p>Key defined: ${typeof process !== 'undefined' && process.env && process.env.NEXT_PUBLIC_VAPID_PUBLIC_KEY ? '✅ Yes' : '❌ No (check Vercel env vars)'}</p>`;
        
        // Test service worker registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                results.innerHTML += '<h2>Service Workers:</h2>';
                if (registrations.length === 0) {
                    results.innerHTML += '<p>❌ No service workers registered</p>';
                } else {
                    registrations.forEach((reg, i) => {
                        results.innerHTML += `<p>✅ SW ${i + 1}: ${reg.scope}</p>`;
                        results.innerHTML += `<p>State: ${reg.active ? reg.active.state : 'inactive'}</p>`;
                    });
                }
            });
        }
        
        // Console output
        console.log('=== Push Notification Debug ===');
        console.log('Service Worker supported:', 'serviceWorker' in navigator);
        console.log('Push Manager supported:', 'PushManager' in window);
        console.log('Notifications supported:', 'Notification' in window);
        console.log('Notification permission:', Notification.permission);
    </script>
</body>
</html>
