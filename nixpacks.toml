# Nixpacks configuration for Next.js in monorepo
# This tells Nixpacks where the app actually is

[variables]
NODE_ENV = "production"
NPM_CONFIG_PRODUCTION = "false"

# Change working directory to health-care subdirectory
[phases.setup]
nixPkgs = ["nodejs_20"]
nixpacksVersion = "1.41.0"

[phases.install]
cmds = [
  "cd health-care",
  "npm ci --legacy-peer-deps"
]

[phases.build]  
cmds = [
  "cd health-care",
  "npm run build"
]

[start]
cmd = "cd health-care && npm start"
