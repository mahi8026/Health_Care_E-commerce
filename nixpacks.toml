# Nixpacks configuration for Next.js app in monorepo
# The actual app is in ./health-care/ subdirectory

[variables]
NODE_ENV = "production"

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "cd health-care && npm ci --legacy-peer-deps"
]

[phases.build]  
cmds = [
  "cd health-care && npm run build"
]

[start]
cmd = "cd health-care && npm start"
