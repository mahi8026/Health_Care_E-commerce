name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Check code quality
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: health-care/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: health-care
        run: npm install --legacy-peer-deps
      
      - name: Run frontend linter
        working-directory: health-care
        run: npm run lint || true
      
      - name: Build frontend
        working-directory: health-care
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
      
      - name: Install backend dependencies
        working-directory: health-care/backend
        run: npm install
      
      - name: Run backend tests
        working-directory: health-care/backend
        run: npm test || true

  # Deploy frontend to Vercel
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: health-care
          vercel-args: '--prod'

  # Deploy backend (Railway auto-deploys on push, so this is just a notification)
  deploy-backend:
    name: Backend Deployment Status
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Notify backend deployment
        run: |
          echo "✅ Backend will be automatically deployed by Railway"
          echo "Monitor deployment at: https://railway.app"

  # Post-deployment checks
  post-deployment:
    name: Post-Deployment Checks
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    
    steps:
      - name: Check frontend health
        run: |
          echo "Checking frontend..."
          curl -f ${{ secrets.NEXT_PUBLIC_SITE_URL }} || exit 1
      
      - name: Check backend health
        run: |
          echo "Checking backend..."
          curl -f ${{ secrets.NEXT_PUBLIC_API_URL }}/health || exit 1
      
      - name: Deployment successful
        run: |
          echo "🎉 Deployment completed successfully!"
          echo "Frontend: ${{ secrets.NEXT_PUBLIC_SITE_URL }}"
          echo "Backend: ${{ secrets.NEXT_PUBLIC_API_URL }}"
