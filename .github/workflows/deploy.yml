name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: health-care/package-lock.json

      - name: Install frontend dependencies
        working-directory: health-care
        run: npm ci --ignore-scripts

      - name: Run frontend linter
        working-directory: health-care
        run: npm run lint || true

      - name: Build frontend
        working-directory: health-care
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.medcorebd.com/api' }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://medcorebd.com' }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME || 'dummy' }}
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET || 'dummy' }}

      - name: Install backend dependencies
        working-directory: health-care/backend
        run: npm install

      - name: Run backend tests
        working-directory: health-care/backend
        run: npm test || true
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_secret
          JWT_REFRESH_SECRET: ci_test_refresh_secret
          MONGODB_URI: mongodb://localhost:27017/medcore-test

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        if: ${{ env.VERCEL_TOKEN != '' }}
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: health-care
          vercel-args: '--prod'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Skip Vercel deploy (secrets not configured)
        if: ${{ env.VERCEL_TOKEN == '' }}
        run: echo "⚠️ Vercel secrets not configured — skipping deploy. Add VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID to repository secrets."
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  deploy-backend:
    name: Backend Deployment Status
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Notify backend deployment
        run: |
          echo "✅ Backend will be automatically deployed by Render"
          echo "Monitor deployment at: https://dashboard.render.com"

  post-deployment:
    name: Post-Deployment Checks
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    if: always() && needs.lint-and-test.result == 'success'

    steps:
      - name: Check frontend health
        run: |
          SITE_URL="${{ secrets.NEXT_PUBLIC_SITE_URL }}"
          if [ -z "$SITE_URL" ]; then
            echo "⚠️ NEXT_PUBLIC_SITE_URL secret not set — skipping health check"
            exit 0
          fi
          echo "Checking frontend at $SITE_URL..."
          curl -f --max-time 30 "$SITE_URL" || echo "⚠️ Frontend health check failed (may still be deploying)"

      - name: Check backend health
        run: |
          API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}"
          if [ -z "$API_URL" ]; then
            echo "⚠️ NEXT_PUBLIC_API_URL secret not set — skipping health check"
            exit 0
          fi
          echo "Checking backend at $API_URL/health..."
          curl -f --max-time 30 "$API_URL/health" || echo "⚠️ Backend health check failed (may still be deploying)"

      - name: Deployment summary
        run: echo "🎉 Deployment pipeline completed!"
