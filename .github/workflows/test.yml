name: Test

on:
  # Disabled temporarily - runs on pull requests only
  pull_request:
    branches:
      - main
      - develop
  # Removed push trigger to reduce workflow runs
  # push:
  #   branches:
  #     - develop

jobs:
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: health-care/package-lock.json
      
      - name: Install dependencies
        working-directory: health-care
        run: npm ci --ignore-scripts
      
      - name: Run linter
        working-directory: health-care
        run: npm run lint
      
      - name: Run tests
        working-directory: health-care
        run: npm test
      
      - name: Build
        working-directory: health-care
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: dummy
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: dummy
      
      - name: Start Next.js server
        working-directory: health-care
        run: npm start &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: dummy
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: dummy
      
      - name: Wait for server to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:3000 > /dev/null 2>&1; do sleep 2; done' || exit 1
      
      - name: Run Lighthouse CI
        working-directory: health-care
        run: npm run lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        # Lighthouse CI will fail the build if performance budgets are not met:
        # - Performance score <85%
        # - LCP >2.5s, FID >100ms, CLS >0.1
        # See lighthouserc.js for full configuration
      
      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: health-care/.lighthouseci
          retention-days: 30

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: health-care/backend/package-lock.json
      
      - name: Install dependencies
        working-directory: health-care/backend
        run: npm install
      
      - name: Run tests
        working-directory: health-care/backend
        run: npm test
        env:
          MONGODB_URI: mongodb://localhost:27017/Mediport-test
          JWT_SECRET: test_jwt_secret_for_ci_cd_pipeline
          JWT_REFRESH_SECRET: test_refresh_secret_for_ci_cd_pipeline
          NODE_ENV: test
