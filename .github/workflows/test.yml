name: Test

on:
  pull_request:
    branches:
      - main
      - develop
  # Merges to main previously landed unvalidated: with a pull-request-only
  # trigger, the merge commit itself never ran the test jobs (the only checks
  # on main came from the scheduled keep-alive workflow). The same two jobs run
  # for both events - nothing is weakened, only added.
  push:
    branches:
      - main

# Cancel superseded runs, but only for pushes to main: pull-request runs are
# never cancelled, so a required check on a PR head can never be cancelled or
# left pending by a later push.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Next 16 requires Node >=20.9 at build time; the >=22 line is needed
          # for the Turbopack font pipeline (fails on 18 and 20 in CI).
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: health-care/package-lock.json
      
      - name: Install dependencies
        working-directory: health-care
        run: npm ci --ignore-scripts
      
      - name: Run linter
        working-directory: health-care
        run: npm run lint
      
      - name: Run tests
        working-directory: health-care
        run: npm test
      
      - name: Build
        working-directory: health-care
        # next/font/google downloads the font files during the build. That
        # download fails intermittently in this repository
        # (NextFontGoogleFontFileReplacer -> "Can't resolve
        # '@vercel/turbopack-next/internal/font/google/font'"), while the same
        # commit builds fine on a re-run - seen on PR #138 and on the main push
        # for 27bfda9c. The build is therefore attempted twice. A deterministic
        # failure still fails the job: both attempts must fail. Only this step
        # is retried - lint, tests and Lighthouse are untouched.
        run: |
          for attempt in 1 2; do
            if npm run build; then
              exit 0
            fi
            if [ "$attempt" = "2" ]; then
              echo "::error::Build failed on both attempts (deterministic failure)"
              exit 1
            fi
            echo "::warning::Build attempt ${attempt} failed - known intermittent next/font fetch; retrying once"
            sleep 10
          done
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: dummy
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: dummy
      
      - name: Start Next.js server
        working-directory: health-care
        run: npm start &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: dummy
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: dummy
      
      - name: Wait for server to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:3000 > /dev/null 2>&1; do sleep 2; done' || exit 1
      
      - name: Run Lighthouse CI
        working-directory: health-care
        run: npm run lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        # Lighthouse CI will fail the build if performance budgets are not met:
        # - Performance score <85%
        # - LCP >2.5s, FID >100ms, CLS >0.1
        # See lighthouserc.js for full configuration
      
      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: health-care/.lighthouseci
          retention-days: 30

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: health-care/backend/package-lock.json
      
      - name: Install dependencies
        working-directory: health-care/backend
        run: npm install
      
      - name: Run tests
        working-directory: health-care/backend
        run: npm test
        env:
          MONGODB_URI: mongodb://localhost:27017/Mediport-test
          JWT_SECRET: test_jwt_secret_for_ci_cd_pipeline
          JWT_REFRESH_SECRET: test_refresh_secret_for_ci_cd_pipeline
          NODE_ENV: test
