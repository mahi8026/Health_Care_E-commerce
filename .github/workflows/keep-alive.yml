name: Backend Keep-Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sS --max-time 90 -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" \
            https://health-care-e-commerce-ubyy.onrender.com/api/health/detailed \
            || echo "ping failed (instance may be booting — request still wakes it)"
