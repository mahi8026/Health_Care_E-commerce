name: Backend Keep-Alive

on:
  schedule:
    # Every 14 minutes — keeps Render free tier awake (sleeps after 15 min)
    # 14-min interval = ~103 runs/day = ~3,090 min/month (within GitHub free 2,000 min)
    - cron: '*/14 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sS --max-time 60 -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" \
            https://health-care-e-commerce-ubyy.onrender.com/api/health \
            || echo "ping failed (instance may be booting)"
