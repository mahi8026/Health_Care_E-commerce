sonar.projectKey=medcore-bd
sonar.projectName=MedCore BD E-Commerce
sonar.projectVersion=2.0.0

# Source directories
sonar.sources=health-care/src,health-care/backend/src
sonar.tests=health-care/src/__tests__,health-care/backend/src/__tests__

# Exclusions
sonar.exclusions=**/node_modules/**,**/*.test.js,**/*.spec.js,**/coverage/**,**/.next/**,**/dist/**,**/build/**

# JavaScript/TypeScript settings
sonar.javascript.lcov.reportPaths=health-care/coverage/lcov.info,health-care/backend/coverage/lcov.info

# Code coverage
sonar.coverage.exclusions=**/*.test.js,**/*.spec.js,**/tests/**,**/__tests__/**

# Encoding
sonar.sourceEncoding=UTF-8

# Language
sonar.language=js

# Additional settings
sonar.javascript.node.maxspace=4096
